<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Stemmen beoordelen</title>
<style>
:root{--bg:#f6f6f4;--fg:#1b1b1b;--card:#fff;--line:#ddd;--mut:#666;--acc:#1b6ef3}
@media(prefers-color-scheme:dark){:root{--bg:#161616;--fg:#eee;--card:#222;--line:#3a3a3a;--mut:#aaa;--acc:#5b9bff}}
body{font:16px/1.45 -apple-system,system-ui,sans-serif;margin:0;background:var(--bg);color:var(--fg)}
main{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:0 0 14px}
h1{font-size:22px;margin:8px 0} h2{font-size:17px;margin:0 0 8px} .mut{color:var(--mut);font-size:14px}
.text{font-size:18px;margin:2px 0 10px}
.clip{border-top:1px solid var(--line);padding:10px 0} audio{width:100%;height:36px}
.scale{display:flex;gap:6px;align-items:center;margin:6px 0;flex-wrap:wrap} .scale b{min-width:110px;font-weight:600;font-size:14px}
.scale button{width:40px;height:36px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;font-size:16px;cursor:pointer}
.scale button.on{background:var(--acc);border-color:var(--acc);color:#fff}
input[type=text]{width:100%;box-sizing:border-box;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);font:inherit}
label.r{display:inline-block;margin-right:16px} .big{padding:10px 18px;border:0;border-radius:8px;background:var(--acc);color:#fff;font-size:16px;cursor:pointer}
.big[disabled]{opacity:.4;cursor:default} #bar{position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:3;font-size:14px;color:var(--mut)}
textarea{width:100%;box-sizing:border-box;height:90px;font:12px monospace}
</style></head><body><main id="m"></main>
<script>
const D={"sentences": [{"id": "sch_sj", "text": "Schrijf maar rustig verder, ik ben benieuwd naar je verhaal over de school en de scheepvaart."}, {"id": "english_word", "text": "Ah, je bedoelt de 'deadline'. Dat woord gebruiken we ook in het Nederlands. Wanneer is jouw deadline?"}, {"id": "question_empathy", "text": "Dat snap ik, dat is stressvol. Wat zou je het liefst willen dat er gebeurt?"}], "clips": [{"id": "5b8305b6", "sentence": "english_word"}, {"id": "14b89057", "sentence": "english_word"}, {"id": "20f18024", "sentence": "english_word"}, {"id": "e4f455cd", "sentence": "question_empathy"}, {"id": "86c52ef3", "sentence": "question_empathy"}, {"id": "958ae81c", "sentence": "question_empathy"}, {"id": "aaf47e9d", "sentence": "question_empathy"}, {"id": "9d3c407c", "sentence": "sch_sj"}, {"id": "caca623d", "sentence": "sch_sj"}, {"id": "67c3dbe8", "sentence": "sch_sj"}, {"id": "db5dc79c", "sentence": "english_word"}, {"id": "b902218d", "sentence": "question_empathy"}, {"id": "1e30c157", "sentence": "sch_sj"}, {"id": "44168933", "sentence": "sch_sj"}, {"id": "910418a3", "sentence": "question_empathy"}, {"id": "e73e1af6", "sentence": "question_empathy"}, {"id": "d9d05320", "sentence": "english_word"}, {"id": "fdb7483b", "sentence": "english_word"}, {"id": "29fe71f6", "sentence": "english_word"}, {"id": "ca05ca9b", "sentence": "question_empathy"}, {"id": "554db962", "sentence": "question_empathy"}, {"id": "3eef91a0", "sentence": "sch_sj"}, {"id": "085d23b0", "sentence": "question_empathy"}, {"id": "06616cc2", "sentence": "sch_sj"}, {"id": "9f33f6a7", "sentence": "english_word"}, {"id": "31d9bbe4", "sentence": "english_word"}, {"id": "87146b14", "sentence": "sch_sj"}, {"id": "0c0d2e4e", "sentence": "question_empathy"}, {"id": "1b70c24b", "sentence": "sch_sj"}, {"id": "7240128c", "sentence": "sch_sj"}, {"id": "7a163597", "sentence": "english_word"}, {"id": "59a3cf5d", "sentence": "sch_sj"}, {"id": "05a21a1e", "sentence": "english_word"}, {"id": "919d4632", "sentence": "question_empathy"}, {"id": "90820fcf", "sentence": "sch_sj"}, {"id": "917dcab7", "sentence": "english_word"}, {"id": "d7b6ae2f", "sentence": "sch_sj"}, {"id": "02c712fa", "sentence": "sch_sj"}, {"id": "7eb4c9aa", "sentence": "question_empathy"}, {"id": "061ead6c", "sentence": "sch_sj"}, {"id": "85c963e6", "sentence": "english_word"}, {"id": "2cbba8c7", "sentence": "english_word"}, {"id": "31020d49", "sentence": "question_empathy"}, {"id": "b7dadb39", "sentence": "english_word"}, {"id": "4eefcb3b", "sentence": "english_word"}, {"id": "bdc0bdf2", "sentence": "question_empathy"}, {"id": "ae3427f4", "sentence": "question_empathy"}, {"id": "59885991", "sentence": "sch_sj"}], "form": "1FAIpQLSeC-FDAvPjYUy6vT9uc39WZqX4gPYUh4I5Q9JKdRLcadoiDHg", "entry": "37029409"};
const KEY='stemmen-v2', $=s=>document.querySelector(s);
const rnd=()=>{const a=new Uint8Array(8);crypto.getRandomValues(a);return [...a].map(x=>x.toString(16).padStart(2,'0')).join('')};
let S;try{S=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){S=null}
if(!S||!S.tester)S={tester:rnd(),native:'',region:'',r:{},done:false,seed:Math.floor(Math.random()*2**31)};
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
function shuffle(arr,seed){let s=seed>>>0;const a=arr.slice();const next=()=>{s=(s*1664525+1013904223)>>>0;return s/2**32};
 for(let i=a.length-1;i>0;i--){const j=Math.floor(next()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const esc=t=>t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const total=D.clips.length, done=()=>D.clips.filter(c=>S.r[c.id]&&S.r[c.id].accent&&S.r[c.id].natural).length;

function intro(){$('#m').innerHTML=`<h1>Help me Nederlandse stemmen te beoordelen</h1>
<div class="card"><p>Ik bouw een Nederlandse taaltutor en wil weten welke computerstem het meest als een echte Nederlander klinkt. Jij luistert naar ${total} korte fragmenten (zo'n ${Math.round(total/3)} minuten) en geeft elk twee cijfers van 1 tot 5. Je hoeft geen naam in te vullen; je antwoorden zijn anoniem. Je voortgang wordt in je browser bewaard. Aan het einde worden je antwoorden verstuurd.</p>
<p class="mut">Gebruik het liefst een koptelefoon. Je mag elk fragment zo vaak beluisteren als je wilt. Je ziet niet welke stem het is.</p>
<p><b>Ben je Nederlander of Vlaming (moedertaalspreker)?</b><br>
<label class="r"><input type="radio" name="n" value="ja"> Ja</label><label class="r"><input type="radio" name="n" value="nee"> Nee</label></p>
<p>Uit welke regio kom je ongeveer? (optioneel) <input type="text" id="reg" maxlength="60" placeholder="bijv. Utrecht, Antwerpen, Groningen"></p>
<button class="big" id="go" disabled>Beginnen</button></div>`;
 document.querySelectorAll('input[name=n]').forEach(i=>i.onchange=()=>{S.native=i.value;$('#go').disabled=false;persist()});
 $('#reg').oninput=e=>{S.region=e.target.value;persist()};$('#go').onclick=rate;
 if(S.native){document.querySelector(`input[name=n][value=${S.native}]`).checked=true;$('#go').disabled=false;$('#reg').value=S.region||''}}

function grp(id,k,name,lo,hi){const cur=(S.r[id]||{})[k];let h=`<div class="scale"><b>${name}</b><span class="mut">${lo}</span>`;
 for(let i=1;i<=5;i++)h+=`<button data-c="${id}" data-k="${k}" data-v="${i}" class="${cur===i?'on':''}">${i}</button>`;return h+`<span class="mut">${hi}</span></div>`}

function rate(){const m=$('#m');
 m.innerHTML=`<div id="bar"></div><h1>Beoordeel de fragmenten</h1><p class="mut"><b>Accent:</b> 1 = duidelijk een buitenlands accent, 5 = niet van een Nederlander te onderscheiden. <b>Natuurlijk:</b> 1 = robot, 5 = een echt mens die praat. Klinkt er een woord of klank fout? Zet het in het opmerkingenveld.</p>`;
 D.sentences.forEach((s,si)=>{const cs=shuffle(D.clips.filter(c=>c.sentence===s.id),S.seed+si*7919);
  const el=document.createElement('div');el.className='card';
  el.innerHTML=`<h2>Zin ${si+1} van ${D.sentences.length}</h2><div class="text">“${esc(s.text)}”</div>`+cs.map((c,i)=>`<div class="clip"><b>Fragment ${String.fromCharCode(65+i)}</b>
  <audio controls preload="none" src="audio/${c.id}.mp3"></audio>${grp(c.id,'accent','Accent','buitenlands','native')}${grp(c.id,'natural','Natuurlijk','robot','mens')}
  <input type="text" data-c="${c.id}" maxlength="300" placeholder="Opmerking (optioneel): fout woord of klank?" value="${esc((S.r[c.id]||{}).notes||'')}"></div>`).join('');
  m.appendChild(el)});
 const f=document.createElement('div');f.className='card';f.innerHTML=`<button class="big" id="send" disabled>Versturen</button><p class="mut" id="msg"></p><div id="fb"></div>`;m.appendChild(f);
 m.querySelectorAll('.scale button').forEach(b=>b.onclick=()=>{const id=b.dataset.c,k=b.dataset.k,v=+b.dataset.v;S.r[id]=S.r[id]||{};S.r[id][k]=S.r[id][k]===v?null:v;persist();
  b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('on',S.r[id][k]===+x.dataset.v));upd()});
 m.querySelectorAll('input[type=text]').forEach(i=>i.oninput=()=>{const id=i.dataset.c;S.r[id]=S.r[id]||{};S.r[id].notes=i.value;persist()});
 $('#send').onclick=send;upd()}

function upd(){$('#bar').textContent=`${done()} van ${total} fragmenten beoordeeld`;const b=$('#send');if(b)b.disabled=done()<total;
 const g=$('#msg');if(g&&!S.done)g.textContent=done()<total?'Beoordeel alle fragmenten om te kunnen versturen.':'Klaar! Klik op Versturen.'}

function payload(){return {tester:S.tester,native:S.native,region:S.region,at:new Date().toISOString(),ratings:D.clips.map(c=>({clip:c.id,accent:(S.r[c.id]||{}).accent,natural:(S.r[c.id]||{}).natural,notes:(S.r[c.id]||{}).notes||''}))}}
async function send(){S.done=true;persist();$('#send').disabled=true;let sent=false;
 if(D.form&&D.entry){try{const b=new URLSearchParams();b.set('entry.'+D.entry,'STEMMEN1 '+JSON.stringify(payload()));
  await fetch('https://docs.google.com/forms/d/e/'+D.form+'/formResponse',{method:'POST',mode:'no-cors',body:b});sent=true}catch(e){}}
 S.sent=sent;persist();finish()}
function finish(){const p='STEMMEN1 '+JSON.stringify(payload());$('#send').disabled=true;
 $('#msg').innerHTML=S.sent?'<b>Bedankt!</b> Je antwoorden zijn verstuurd. 🙏 Je hoeft niets meer te doen. (Wil je een kopie bewaren? Dat kan hieronder.)':'<b>Bedankt!</b> Automatisch versturen is niet gelukt. Stuur je antwoorden naar mij door met een knop hieronder.';
 $('#fb').innerHTML=`<p><button class="big" id="sh">Stuur mijn antwoorden door</button> <button class="big" id="cp">Kopieer</button> <button class="big" id="dl">Download</button></p><textarea readonly id="ta">${esc(p)}</textarea>`;
 $('#ta').onfocus=e=>e.target.select();
 $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(p);$('#cp').textContent='Gekopieerd ✓'}catch(e){$('#ta').select()}};
 $('#dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([p],{type:'text/plain'}));a.download='stemmen-'+S.tester.slice(0,6)+'.txt';a.click()};
 $('#sh').onclick=async()=>{if(navigator.share){try{await navigator.share({title:'Stemmen rating',text:p})}catch(e){}}else{location.href='https://wa.me/?text='+encodeURIComponent(p)}}}

if(S.done){rate();finish()}else if(Object.keys(S.r).length&&S.native)rate();else intro();
</script></body></html>
